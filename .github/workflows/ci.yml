name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run openapi:validate
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:media
      - run: npm run build
      - run: npm run sdk:pack
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Validate monitoring compose profile
        run: docker compose --profile monitoring config >/dev/null
      - run: docker compose up -d --build
      - name: Wait for API health
        run: |
          for attempt in {1..60}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - run: docker compose run --rm --no-deps integration
      - name: Validate migrations are repeatable
        run: docker compose run --rm migrate
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail=200
      - name: Teardown
        if: always()
        run: docker compose down -v
